# The repo's verbs. package.json keeps `build` only because Vercel runs it; it is the
# same command as `mise build`.

[tasks.dev]
description = "demo site on :3100 (also serves the registry at /r/<name>.json)"
run = "pnpm next dev --port 3100"

[tasks.registry]
description = "registry.json -> public/r/*.json"
run = "pnpm shadcn build"

[tasks.build]
description = "registry + site"
run = ["pnpm shadcn build", "pnpm next build"]

[tasks.check]
description = "typecheck, lint, registry build + assertions, every runnable example (public/r is committed: a stale build shows as a diff)"
run = [
  "pnpm tsc --noEmit",
  "pnpm biome check .",
  "pnpm shadcn build",
  "bun scripts/validate-registry.ts",
  "bun scripts/examples/quote-card.ts",
  "bun scripts/examples/lightbox-motion.ts",
  "bun scripts/examples/lightbox-flight.ts",
  "bun scripts/examples/lightbox-hold.ts",
  "bun scripts/examples/lightbox-wheel-phase.ts",
  "bun scripts/examples/lightbox-wheel.ts",
  "bun scripts/examples/lightbox-gesture.ts",
]

[tasks.format]
run = "pnpm biome check --write ."

[tasks.still]
description = "render the quote card into .renders/ (never opened: judge it on the demo page). `ground` and `share` sweep the fusion with the quote body stripped"
usage = '''
arg "[mode]" help="corpus | faces | ground | share | block" default=""
arg "[n]" help="how many, for corpus" default="12"
'''
run = 'bun scripts/quote-still.ts {{arg(name="mode")}} {{arg(name="n")}}'

[tasks.portrait]
description = "crop any picture into the square portrait the quote card wants, on the face rather than on the middle, and write its avatar.json sidecar (focus + tone)"
usage = '''
arg "<src>" help="an image path, or wikipedia:Article_Title"
arg "<out>" help="where the png goes"
arg "[size]" help="square side in px" default="256"
'''
run = 'bun scripts/portrait.ts {{arg(name="src")}} {{arg(name="out")}} {{arg(name="size")}}'

[tasks.portraits]
description = "fill every author folder under <dir> that has no avatar.png, from wikipedia, and write the avatar.json sidecar (focus + tone) for any portrait missing one"
usage = '''
arg "<dir>" help="a directory of author folders"
arg "[size]" help="square side in px" default="256"
'''
run = 'bun scripts/portrait.ts --fill {{arg(name="dir")}} {{arg(name="size")}}'

[tasks.add]
description = "build, then copy one item into a consumer (default: the garden)"
usage = '''
arg "<item>" help="registry item name"
arg "[dir]" help="consumer directory" default="/Users/adrian/Developer/untitled/apps/garden"
'''
run = 'pnpm shadcn build && pnpm shadcn add "$PWD/public/r/{{arg(name="item")}}.json" --cwd "{{arg(name="dir")}}" --overwrite --yes'
