allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
# Own package, trusted publisher: releases are adopted the day they ship.
minimumReleaseAgeExclude:
  - '@adriangalilea/utils'
  # Same reviewed editor version already used in Garden; fixes toolbar form submission.
  - 'wordgard@0.5.2'
# fastq 1.20.2 shipped without provenance (1.20.1 and 1.20.3 both carry SLSA provenance);
# pinned to the last trusted version. Drop once 1.20.3 clears the 7-day quarantine.
overrides:
  fastq: 1.20.1
